# From the PR #52 review: copies of one episode in one torrent that differ
# only by version or quality. The best copy is kept (version, then
# REPACK/PROPER, then resolution, then size); the others are superseded,
# not a conflict that assigns nothing. Schema: see anime.yaml.

- id: review-dup-erai-v2
  show: spy-x-family
  torrent: "[Erai-raws] Spy x Family Season 2 - 05"
  tags: [review, version]
  files:
    - {path: "[Erai-raws] Spy x Family Season 2 - 05 [1080p][Multiple Subtitle][ENG][POR-BR].mkv", expect: {extra: superseded}}
    - {path: "[Erai-raws] Spy x Family Season 2 - 05 [1080p][v2][Multiple Subtitle][ENG][POR-BR].mkv", expect: {eps: [S02E05], min_conf: high}}

