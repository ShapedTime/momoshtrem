# Edge cases: wrong torrents, per-season anime folders, dates a day off,
# underscore names, obfuscated files, short anime markers, specials folders.
# Schema: see anime.yaml.

# A torrent of another show: the rules can't tell it from a renamed release,
# but they must not be sure of it.
- id: wrong-show
  show: the-boys
  tags: [wrong-torrent]
  files:
    - path: Breaking.Bad.S01E01.Pilot.720p.BluRay.x264-GRP.mkv
      ambiguous: true
      expect: {acceptable: [null, S01E01], max_conf: medium}

