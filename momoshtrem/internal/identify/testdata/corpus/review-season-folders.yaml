# A season-1 batch: the folder's season and the absolute number agree, so
# it's as sure as the same file alone.
- id: review-season1-batch
  show: spy-x-family
  golden: true
  torrent: "[Anime Time] Spy x Family (Season 01) [1080p][HEVC 10bit x265][AAC][Multi Sub] (Batch)"
  tags: [review, folder-season, batch]
  files:
    - {path: "[Anime Time] Spy x Family - 01 [1080p][HEVC 10bit x265][AAC][Multi Sub].mkv", expect: {eps: [S01E01], min_conf: high}}
    - {path: "[Anime Time] Spy x Family - 12 [1080p][HEVC 10bit x265][AAC][Multi Sub].mkv", expect: {eps: [S01E12], min_conf: high}}
    - {path: "[Anime Time] Spy x Family - 25 [1080p][HEVC 10bit x265][AAC][Multi Sub].mkv", expect: {eps: [S01E25], min_conf: high}}
