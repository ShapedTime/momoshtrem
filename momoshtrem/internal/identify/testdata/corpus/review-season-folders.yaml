# From the PR #52 review: season folders whose numbering restarts at 01,
# with a file past the season's end. The folder decides how its numbers
# read; an overflow file gets no episode and never flips the others.
# Schema: see anime.yaml.

- id: review-aot-season2-folder
  show: attack-on-titan
  torrent: "[Group] Shingeki no Kyojin Season 2 [BD 1080p]"
  tags: [review, folder-season, overflow]
  files:
    - {path: "[Group] Shingeki no Kyojin - 01 [BD 1080p].mkv", expect: {eps: [S02E01]}}
    - {path: "[Group] Shingeki no Kyojin - 02 [BD 1080p].mkv", expect: {eps: [S02E02]}}
    - {path: "[Group] Shingeki no Kyojin - 12 [BD 1080p].mkv", expect: {eps: [S02E12]}}
    - {path: "[Group] Shingeki no Kyojin - 13 [BD 1080p].mkv", expect: {kind: unknown}}

