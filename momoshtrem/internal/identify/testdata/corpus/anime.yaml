# Episode-mapping corpus: the spec for internal/identify. Schema:
#
#   - id: unique case name
#     show: fixture in ../shows (without .yaml)
#     torrent: torrent name; for a single file it defaults to the file's path
#     golden: true      whole-torrent case for cmd/classifier-eval (AI eval)
#     tags: [...]       free-form, for reading the report
#     now: 2026-10-15   "today" for air-date checks (this is the default)
#     hint: {season: 2, episode: 5}   assign hint
#     drop_specials: true   load the show without season 0
#     files:            paths are relative to the torrent's folder when the
#                       case has several files; a single file is the torrent
#       - path: "..."
#         size: 1.2GB   optional; videos default to 1.2GB
#         ambiguous: true   only acceptable and max_conf are checked
#         expect:
#           kind: episode|special|extra|sample|subtitle|unknown
#                       (omit: episode, or special when every target is S00;
#                       extra, or sample, when `extra` is set)
#           eps: [S01E05, S01E06]   the target episodes, as TMDB numbers them
#           extra: opening|ending|sample|trailer|featurette|font|info|image|superseded|other
#           min_conf: high|medium|low   reported when missed
#           max_conf: high|medium|low   the test fails when exceeded
#           acceptable: [S00E03, "S01E01+S01E02", null]   ambiguous files

- id: frieren-subsplease-05
