# From the PR #52 review: torrents of another show whose S/E exists in this
# one. The rules can't tell them from a renamed release, but a title that
# isn't this show's (or a year more than one off) must keep them from being
# high. Schema: see anime.yaml.

- id: review-wrong-law-and-order
  show: law-and-order-svu
  tags: [review, wrong-torrent, title-prefix]
  files:
    - path: Law.and.Order.S20E05.1080p.WEB.H264-GRP.mkv
      ambiguous: true
      expect: {acceptable: [null, S20E05], max_conf: medium}

