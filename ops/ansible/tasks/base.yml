- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Ubuntu's 50unattended-upgrades stays as it is: security updates only, no
# automatic reboot. Docker's repo isn't an allowed origin, so an unattended
# upgrade never restarts dockerd.
- name: Turn on unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
