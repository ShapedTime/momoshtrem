# Brings the stack up at boot, from whatever #38 has deployed in app_dir.
# Until compose.yml exists there, the unit is skipped, not failed.
- name: Install the boot unit
  ansible.builtin.template:
    src: momoshtrem-stack.service.j2
    dest: /etc/systemd/system/momoshtrem-stack.service
    owner: root
    group: root
    mode: "0644"
  register: stack_unit

- name: Enable the boot unit
  ansible.builtin.systemd_service:
    name: momoshtrem-stack
    enabled: true
    daemon_reload: true
  when: not (ansible_check_mode and stack_unit is changed)
