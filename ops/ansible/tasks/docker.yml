# Docker engine and the compose plugin from Docker's apt repository.
- name: Remove the distro Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Add Docker's apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

# daemon.json goes in before the engine, so dockerd's first start already has
# the log caps.
- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: docker_etc

- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json(indent=2) }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and docker_etc is changed)
  notify: Restart docker

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo is changed }}"
  when: not (ansible_check_mode and docker_repo is changed)

- name: Start Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode or docker_preinstalled

# Membership in docker is root-equivalent. It's kept for running docker
# without sudo, as on the old VM (#34, #43).
- name: Add the admin user to the docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
  when: not ansible_check_mode or docker_preinstalled
