# Run ansible-playbook from this folder so this file is picked up.
# The runbook is docs/ops/HOST.md.

[defaults]
inventory = inventory.yml
interpreter_python = /usr/bin/python3
callback_result_format = yaml

[privilege_escalation]
# The sudo password is asked for at run time and never stored (ops PLAN §7).
become_ask_pass = True

[ssh_connection]
pipelining = True
