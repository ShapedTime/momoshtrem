# Checks every PR, and publishes images for every main commit whose checks
# passed. Runbook: docs/ops/CI.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels its older run. Every main commit runs to the end,
# so each one gets its images.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: momoshtrem_test
          POSTGRES_USER: momoshtrem
          POSTGRES_PASSWORD: momoshtrem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momoshtrem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database, so the Postgres integration tests run instead of skipping
      MOMOSHTREM_TEST_DATABASE_URL: postgres://momoshtrem:momoshtrem@localhost:5432/momoshtrem_test?sslmode=disable
    defaults:
      run:
        working-directory: momoshtrem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: momoshtrem/go.mod
          cache-dependency-path: momoshtrem/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Test on the Node major the image ships with, so a Dependabot bump of
      # web/Dockerfile is checked here too
      - id: node
        run: echo "major=$(sed -n 's/^FROM node:\([0-9]*\)-.*/\1/p' Dockerfile | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # PRs: prove both images still build. Runs next to the checks, not after them.
  image:
    if: github.event_name == 'pull_request'
    name: image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: momoshtrem
            context: momoshtrem
          - image: momoshtrem-web
            context: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          # Read the cache main writes; PR runs don't write, so they can't evict it
          cache-from: type=gha,scope=${{ matrix.image }}

  # main: publish ghcr.io/shapedtime/<image>:<full sha>, only once the checks passed
  publish:
    if: github.event_name == 'push' && github.repository == 'ShapedTime/momoshtrem'
    needs: [go, web]
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: momoshtrem
            context: momoshtrem
            # Reported by /api/status
            build-args: VERSION=${{ github.sha }}
          - image: momoshtrem-web
            context: web
            build-args: ''
    env:
      IMAGE: ghcr.io/shapedtime/${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags are immutable: a re-run never replaces an image that may already be deployed
      - id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already published; skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: ${{ matrix.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Whether the streaming path changed, for streamlab: a PR's merge commit
  # against its first parent, the base it merges into. main always runs it,
  # so its record on main shows how often it fails. The paths are the lab's
  # (streamlab affected's Streaming), less the library.
  streaming-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD -- \
            .github/workflows/ci.yml \
            momoshtrem/go.mod momoshtrem/go.sum \
            momoshtrem/cmd/momoshtrem/main.go \
            momoshtrem/cmd/streamlab/ \
            momoshtrem/internal/vfs/ momoshtrem/internal/webdav/ momoshtrem/internal/streaming/ \
            momoshtrem/internal/torrent/ momoshtrem/internal/sessions/ momoshtrem/internal/hdrezka/ \
            momoshtrem/internal/service/hdrezka_source.go \
            momoshtrem/internal/streamlab/ momoshtrem/internal/streamtrace/ \
            momoshtrem/internal/config/ momoshtrem/internal/common/ momoshtrem/internal/metrics/)
          if [ -n "$files" ]; then
            printf 'The streaming path changed:\n%s\n' "$files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No streaming path changed: streamlab skips"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The streaming path's safety net (docs/streamlab/PLAN.md, S10): the lab's
  # and the streaming packages' tests under -race, then the gate tier held to
  # testdata/baseline.json (counts and correctness, never timings: D5).
  # Non-blocking until it has been green on main for a week (docs/ops/CI.md §7)
  streamlab:
    needs: streaming-paths
    if: needs.streaming-paths.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    # ~22 min: the tests 2, the gate 18 (22 scenarios, a warm-up and a rep
    # each). The rest is room for confirmation reps and hard timeouts
    timeout-minutes: 40
    defaults:
      run:
        shell: bash # -eo pipefail, for tee
        working-directory: momoshtrem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch's history: affected needs the PR's base and the
          # commits the scenarios guard
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: momoshtrem/go.mod
          cache-dependency-path: momoshtrem/go.sum
      - name: Build streamlab
        run: |
          mkdir -p "$RUNNER_TEMP/streamlab"
          go build -tags disable_libutp -o "$RUNNER_TEMP/streamlab-bin" ./cmd/streamlab
      # The anti-gaming rule (PLAN §6 affected, §11): a diff that changes the
      # streaming path and the lab together gets a warning, for a reviewer and
      # a written reason. It runs first, on the checkout as it came (affected
      # diffs the working tree), and never fails the job: a fix that retires a
      # known issue changes the registry and the baseline with the code
      - name: streamlab affected --strict
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          out="$RUNNER_TEMP/streamlab"
          set +e
          "$RUNNER_TEMP/streamlab-bin" affected --strict --base "$BASE" > "$out/affected.txt" 2> "$out/affected-warnings.txt"
          code=$?
          set -e
          # The scenario list stays out of the log: setup-go's problem matcher
          # reads its "<file>.go: <why>" lines as errors. The summary has it
          head -n 1 "$out/affected.txt"
          {
            echo "### streamlab affected, against $BASE"
            case "$code" in
              0) echo "No warning." ;;
              1) echo "A reviewer checks the lab change doesn't loosen what would catch the streaming change, and the PR says why they land together:"
                 sed -n 's/^WARNING: /- /p' "$out/affected-warnings.txt" ;;
              *) echo "affected couldn't run (exit $code):"
                 sed 's/^/    /' "$out/affected-warnings.txt" ;;
            esac
            printf '\n<details><summary>Scenarios and commands</summary>\n\n```\n'
            cat "$out/affected.txt"
            printf '```\n</details>\n\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            sed -n 's/^WARNING: /::warning title=streamlab affected::/p' "$out/affected-warnings.txt"
          elif [ "$code" -ne 0 ]; then
            cat "$out/affected-warnings.txt"
          fi
          exit "$code"
      # -race needs cgo; disable_libutp keeps it on the pure-Go uTP production
      # runs (PLAN D3). -count=1: a race is caught only by running the tests
      - name: go test -race
        run: |
          go test -race -tags disable_libutp -count=1 -timeout 15m \
            ./internal/streamlab/... ./cmd/streamlab/... ./internal/vfs/... \
            ./internal/streaming/... ./internal/torrent/... ./internal/sessions/... \
            2>&1 | tee "$RUNNER_TEMP/streamlab/go-test-race.txt"
      # Runs even when the tests failed
      - name: streamlab gate
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/streamlab-bin" gate --reps 1 --out "$RUNNER_TEMP/streamlab/gate"'
      - name: Gate summary
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/streamlab/gate/gate.md" >> "$GITHUB_STEP_SUMMARY" || true
      # On failure and timeout too: the reports, child logs and goroutine dumps
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamlab
          path: ${{ runner.temp }}/streamlab/
          retention-days: 14
          overwrite: true
