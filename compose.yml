# One file for the VM and for local development. The VM pulls the GHCR images
# for MOMOSHTREM_TAG and never builds (docs/ops/DEPLOY.md). Locally, leave
# MOMOSHTREM_TAG unset: `docker compose up -d --build` builds them as :dev.
# The pinned project name keeps the caddy_data volume (Caddy's CA) named
# momoshtrem_caddy_data, wherever the file lives.
name: momoshtrem

services:
  jackett:
    image: lscr.io/linuxserver/jackett:0.24.2800
    container_name: jackett
    # Loopback only: reach it over an SSH tunnel (ops PLAN D8)
    ports:
      - 127.0.0.1:9117:9117
    volumes:
      - ${JACKETT_DATA:?set the Jackett config folder in .env}:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9117/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  postgres:
    image: postgres:16.15-alpine
    container_name: momoshtrem-postgres
    environment:
      POSTGRES_DB: momoshtrem
      POSTGRES_USER: momoshtrem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${MOMOSHTREM_PGDATA:?set the Postgres data folder in .env}:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momoshtrem"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  momoshtrem:
    image: ghcr.io/shapedtime/momoshtrem:${MOMOSHTREM_TAG:-dev}
    build:
      context: ./momoshtrem
      dockerfile: Dockerfile
      args:
        VERSION: ${MOMOSHTREM_VERSION:-dev}
    container_name: momoshtrem
    # REST API (4444) accessible by web internally. Every /api request must
    # carry X-Momoshtrem-Token = BACKEND_API_TOKEN (set it for web too).
    # WebDAV (36911) accessible by caddy internally
    expose:
      - "4444"
      - "36911"
    # Metrics on loopback only: reach them over an SSH tunnel (ops PLAN D8)
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ${MOMOSHTREM_CONFIG:?set the momoshtrem config folder in .env}:/config
      - ${MOMOSHTREM_DATA:?set the momoshtrem data folder in .env}:/data
    # The settings below come from env; config.yaml in /config is optional and
    # covers the rest (ports, torrent, streaming...).
    environment:
      - DATABASE_URL=postgres://momoshtrem:${POSTGRES_PASSWORD}@postgres:5432/momoshtrem?sslmode=disable
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - WEBDAV_PUBLIC_URL=${WEBDAV_PUBLIC_URL:-}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-}
      - TMDB_RPS=${TMDB_RPS:-}
      - JACKETT_URL=http://jackett:9117
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - HDREZKA_ENABLED=${HDREZKA_ENABLED:-}
      - HDREZKA_URL=${HDREZKA_URL:-}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:-}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - TORRENT_LISTEN_PORT=${TORRENT_LISTEN_PORT:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # 200 once the database answers; the image has BusyBox wget, not curl
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4444/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  caddy:
    image: caddy:2.11.7-alpine
    container_name: caddy
    ports:
      - "443:443"       # The web UI via HTTPS (the router forwards it)
      - "443:443/udp"   # HTTP/3
      - "36911:36911"   # WebDAV via HTTPS
      - "5050:5050"     # pgAdmin (the Caddyfile allows LAN_CIDR only)
    # Read by the Caddyfile as {$VAR}
    environment:
      - WEBDAV_HOST=${WEBDAV_HOST:?set the public hostname in .env}
      - WEBDAV_USER=${WEBDAV_USER:?set the WebDAV user in .env}
      - WEBDAV_PASSWORD_HASH=${WEBDAV_PASSWORD_HASH:?set the WebDAV password hash in .env}
      - LAN_CIDR=${LAN_CIDR:-192.168.0.0/24}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      momoshtrem:
        condition: service_healthy
    restart: unless-stopped
    # The admin API answers once the config is loaded
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/reverse_proxy/upstreams"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  web:
    image: ghcr.io/shapedtime/momoshtrem-web:${MOMOSHTREM_TAG:-dev}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: momoshtrem-web
    # Loopback only: everyone else comes through Caddy on 443, so the
    # forwarded-for address can be trusted (ops PLAN D8)
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - APP_USERNAME=${APP_USERNAME:-}
      - APP_PASSWORD=${APP_PASSWORD}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - MOMOSHTREM_URL=http://momoshtrem:4444
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-}
      - AUTH_GLOBAL_MAX_FAILURES=${AUTH_GLOBAL_MAX_FAILURES:-}
      - AUTH_WINDOW_MINUTES=${AUTH_WINDOW_MINUTES:-}
      - AUTH_BLOCK_MINUTES=${AUTH_BLOCK_MINUTES:-}
      - WEBDAV_INTERNAL_URL=${WEBDAV_INTERNAL_URL:-}
    depends_on:
      momoshtrem:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
